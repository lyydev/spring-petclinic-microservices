# Reusable Composite Action: AWS OIDC Authentication & Amazon ECR Login
# Stories: PETPLAT-49, PETPLAT-52, PETPLAT-53
#
# Authenticates GitHub Actions to AWS using short-lived OIDC WebIdentity tokens
# (sts:AssumeRoleWithWebIdentity) — never static AWS access keys — and logs Docker
# into Amazon ECR private registry.

name: "AWS OIDC ECR Login"
description: "Assume AWS IAM role via GitHub OIDC and authenticate Docker to Amazon ECR"

inputs:
  role-to-assume:
    description: "IAM Role ARN to assume via GitHub OIDC (secrets.AWS_ROLE_ARN)"
    required: true
  aws-region:
    description: "AWS region hosting the ECR repositories (vars.AWS_REGION; defaults to us-east-1)"
    required: false
    default: "us-east-1"
  aws-account-id:
    description: "Expected 12-digit AWS account ID for registry verification (vars.AWS_ACCOUNT_ID)"
    required: false
    default: ""

outputs:
  registry:
    description: "Authenticated Amazon ECR registry URI (e.g. 037547369073.dkr.ecr.us-east-1.amazonaws.com)"
    value: ${{ steps.login-ecr.outputs.registry }}

runs:
  using: "composite"
  steps:
    - name: Validate OIDC inputs
      shell: bash
      env:
        AWS_ROLE_ARN: ${{ inputs.role-to-assume }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        AWS_REGION="${AWS_REGION:-us-east-1}"
        if [[ -z "${AWS_ROLE_ARN}" ]]; then
          echo "::error::secrets.AWS_ROLE_ARN is required for OIDC authentication."
          exit 1
        fi
        if [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
          echo "::error::Invalid IAM Role ARN format in secrets.AWS_ROLE_ARN."
          exit 1
        fi
        if [[ ! "${AWS_REGION}" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]; then
          echo "::error::Invalid vars.AWS_REGION format '${AWS_REGION}'."
          exit 1
        fi

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region != '' && inputs.aws-region || 'us-east-1' }}
        role-session-name: GitHubActions-PetclinicECR

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      with:
        mask-password: "true"

    - name: Verify ECR registry matches expected AWS account
      if: inputs.aws-account-id != ''
      shell: bash
      env:
        EXPECTED_ACCOUNT_ID: ${{ inputs.aws-account-id }}
        EXPECTED_REGION: ${{ inputs.aws-region != '' && inputs.aws-region || 'us-east-1' }}
        ACTUAL_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        set -euo pipefail
        EXPECTED_REGISTRY="${EXPECTED_ACCOUNT_ID}.dkr.ecr.${EXPECTED_REGION}.amazonaws.com"
        if [[ "${ACTUAL_REGISTRY}" != "${EXPECTED_REGISTRY}" ]]; then
          echo "::error::ECR registry mismatch: expected '${EXPECTED_REGISTRY}', got '${ACTUAL_REGISTRY}'."
          exit 1
        fi
